<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Photo coming soon">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1" fill="#dee2de"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="#eef1ed"/>
  <rect width="640" height="400" fill="url(#dots)"/>

  <!-- Centred frame mark: an empty image slot, drawn in hairlines. -->
  <g transform="translate(320 170)" fill="none" stroke="#b4b8b4" stroke-width="3.5"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="-64" y="-50" width="128" height="100" rx="11"/>
    <circle cx="-28" cy="-17" r="10"/>
    <path d="M-64 28 l42 -36 28 24 22 -18 36 30"/>
  </g>

  <text x="320" y="286" text-anchor="middle"
        font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="23" letter-spacing="4" fill="#b4b8b4">PHOTO COMING SOON</text>
</svg>
